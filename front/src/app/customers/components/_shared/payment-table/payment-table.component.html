<!-- Define the custom template for payment status -->
<ng-template #statusTemplate let-payment>
  <app-payment-status [status]="payment.status"></app-payment-status>
</ng-template>

<!-- Use the reusable data-table component -->
<app-data-table
  [data]="payments"
  [columns]="tableColumns"
  [cellTemplates]="cellTemplates"
  [actions]="tableActions"
  [rows]="25"
  [rowsPerPageOptions]="[25, 50, 100]"
  [paginator]="payments.length > 25"
  [showSearch]="true"
  [searchPlaceholder]="'Rechercher un paiement...'"
  [globalFilterFields]="['reference', 'customerName', 'month']"
  [selectionMode]="'multiple'"
  [dataKey]="'id'"
  [(selectedItems)]="selectedPayments"
  (selectionChange)="onSelectionChange($event)"
  (rowActionClick)="onRowAction($event)"
  [emptyMessage]="'Aucun paiement trouvé'"
  [emptySubMessage]="'Il n\'y a actuellement aucun paiement à afficher'">
</app-data-table>


<!-- Keep the detail dialog -->
<p-dialog
  [(visible)]="detailDialog"
  header="Détail paiement"
  [modal]="true"
  styleClass="p-fluid"
>
  <ng-template pTemplate="content">
    <p-divider layout="horizontal" styleClass="dashed"></p-divider>
    <div class="flex align-items-center justify-content-between mb-3">
      <div class="font-bold md:font-semibold mr-2">{{ payment.reference }}
        ----------- {{ payment.paymentDate }}
      </div>
    </div>

    <p-divider layout="horizontal" styleClass="dotted"></p-divider>

    <div class="flex align-items-center justify-content-between mb-3">
      <div>Mois:</div>
      <div class="font-bold md:font-semibold mr-2">{{ payment.month }}</div>
    </div>

    <div class="flex align-items-center justify-content-between mb-2">
      <div>Client:</div>
      <div class="font-bold md:font-semibold mr-2">{{ payment.customerName }}</div>
    </div>

    <div class="flex align-items-center justify-content-between mb-2">
      <div>Montant payé:</div>
      <div class="font-bold md:font-semibold mr-2">{{ payment.paymentAmount }}</div>
    </div>

    <div class="flex align-items-center justify-content-between mb-2">
      <div>Fréquence:</div>
      <app-customer-payment-frequency
        [frequency]="payment.customerPaymentFrequency ?? '' "></app-customer-payment-frequency>
    </div>

    <div class="flex align-items-center justify-content-between mb-2">
      <div>Statut:</div>
      <app-payment-status [status]="payment.status ?? ''"></app-payment-status>
    </div>

    <div class="flex align-items-center justify-content-between mb-2">
      <div>Fait par:</div>
      <div class="font-bold md:font-semibold mr-2">{{ payment.user }}</div>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <p-button
      label="Fermer"
      icon="pi pi-times"
      [text]="true"
      (onClick)="hideUpdateBill()"
    />
  </ng-template>
</p-dialog>
